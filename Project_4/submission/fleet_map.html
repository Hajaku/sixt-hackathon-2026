// ---------- derived data ----------
const S = DATA.stations.map(s => s.station_id), sIdx = Object.fromEntries(S.map((s, i) => [s, i]));
// balance in [-1, 1]: + = share of available cars left idle, - = share of demand lost
const bal = (free, dem, srv) => (free > 0.5 ? (free - srv) / free : 0) - (dem > 0 ? (dem - srv) / dem : 0);
const KEYS = ["ref", "plan"];
const INIT = DATA.initial;              // the state before any plan acts; both maps start from it
const colSum = m => m[0].map((_, d) => m.reduce((a, row) => a + row[d], 0));
// what the page shows: the mean over all scenarios (sel = -1) or one scenario; fleet and free capacity do not depend on demand
function makeView(sel) {
  const v = {sel, init: {fleet: INIT.fleet}};
  const src = sel < 0 ? {ref: DATA.plans.ref, plan: DATA.plans.plan, initial: INIT} : DATA.scenarios[sel];
  v.init.balance = INIT.fleet.map((_, i) => bal(INIT.free[i], src.initial.demand[i], src.initial.served[i]));
  for (const k of KEYS) {
    const p = DATA.plans[k], s = src[k];
    v[k] = {fleet: p.fleet, free: p.free, demand: s.demand, served: s.served, profit: s.profit,
            balance: p.fleet.map((row, i) => row.map((_, d) => bal(p.free[i][d], s.demand[i][d], s.served[i][d]))),
            demandDay: colSum(s.demand), servedDay: colSum(s.served)};
  }
  return v;
}
let VIEW = makeView(-1);
const total = arr => arr.reduce((a, x) => a + x, 0);
const atDay = (arr, tau, init) => {     // value shown at time tau: day d's value at mid-day, linear in between;
  if (init !== undefined && tau < 0.5) return lerp(init, arr[0], tau / 0.5);   // before that, from the state before the plan acts
  const x = clamp(tau - 0.5, 0, DAYS - 1), d = Math.floor(x), f = x - d;
  return d + 1 < DAYS ? lerp(arr[d], arr[d + 1], f) : arr[d];
};
const cumul = (arr, tau) => {           // sum over the days elapsed, the current day pro rata
  const d = Math.min(Math.floor(tau), DAYS);
  let s = 0;
  for (let i = 0; i < d; i++) s += arr[i];
  return d < DAYS ? s + (tau - d) * arr[d] : s;
};
function color(v) {
  const to = v >= 0 ? COL.idle : COL.lost, f = Math.pow(Math.min(Math.abs(v), 1), 0.8);
  return "rgb(" + COL.mid.map((m, i) => Math.round(lerp(m, to[i], f))).join(",") + ")";
}

// one moving marker per truck (up to 8 cars) or per driven car
function buildMovers(transfers) {
 const movers = [];
 for (const t of transfers) {
  const [x0, y0] = POS[t.from], [x1, y1] = POS[t.to], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
  const off = Math.min(0.16 * len, 34), cx = (x0 + x1) / 2 - dy / len * off, cy = (y0 + y1) / 2 + dx / len * off;
  const gap = Math.min(0.07, 0.55 / t.units);
  for (let i = 0; i < t.units; i++)
    movers.push({mode: t.mode, t0: t.day - 1 + i * gap, t1: t.day - 1 + i * gap + t.lead, x0, y0, x1, y1, cx, cy,
                 cars: t.mode === "truck" ? Math.min(8, t.cars - 8 * i) : 1, key: t.from + ">" + t.to});
 }
 return movers.sort((a, b) => a.t0 - b.t0);
}

  for (const m of movers) if (!seen.has(m.key)) {
    seen.add(m.key);
    el("path", {d: `M${m.x0},${m.y0} Q${m.cx},${m.cy} ${m.x1},${m.y1}`, fill: "none", stroke: "#d6d5cd", "stroke-width": 1}, arcs);
  }
  for (const m of movers) {
    m.el = m.mode === "truck"
      ? el("rect", {x: -5.5, y: -3, width: 11, height: 6, rx: 1.6, fill: "#2b2b29", stroke: SURFACE, "stroke-width": 1, visibility: "hidden"}, moving)
      : el("circle", {r: 2.8, fill: SURFACE, stroke: "#2b2b29", "stroke-width": 1.6, visibility: "hidden"}, moving);
  }
  const mk = (list, sign) => list.map(r => ({...r, sign, t0: r.day - 1 + 0.12,
    el: el("text", {class: "t-pop", visibility: "hidden"}, pops, (sign > 0 ? "+" : "−") + r.cars)}));
  return {key, st, movers, pops: [...mk(p.removals, -1), ...mk(p.additions, 1)]};
}
function describe(key) {                // what the plan does, in words
  const t = DATA.totals[key], byTruck = DATA.plans[key].transfers.filter(x => x.mode === "truck").reduce((a, x) => a + x.cars, 0);
  const parts = [];
  if (t.added) parts.push(`${t.added} cars added`);
  if (t.removed) parts.push(`${t.removed} cars removed`);
  if (t.transferred) parts.push(`${t.transferred} moved (${byTruck} by truck)`);
  return parts.length ? parts.join(" · ") : "the fleet stays where rentals leave it";
}
const tp = DATA.totals.plan, REF = DATA.ref_label;
const stripA = buildStrip("ref", STRIP.yA, REF, describe("ref") + (DATA.totals.ref.transferred ? "" : " · no transfers"));
const stripB = buildStrip("plan", STRIP.yB, "Our plan", describe("plan"));

// timeline
const tl = el("g", {transform: `translate(${TL.x},${TL.y})`, style: "cursor:pointer"});
const cw = TL.w / DAYS;
for (let d = 0; d < DAYS; d++) {
  el("rect", {x: d * cw + 1, y: 0, width: cw - 2, height: TL.h, rx: 5, fill: isWeekend(d) ? TRACK : "transparent", stroke: RULE, "stroke-width": 1}, tl);
  el("text", {x: (d + 0.5) * cw, y: 18, class: "t-day"}, tl, WD[dates[d].getDay()]);
  el("text", {x: (d + 0.5) * cw, y: 36, class: "t-daynum"}, tl, dates[d].getDate());
}
el("rect", {x: 0, y: TL.h + 7, width: TL.w, height: 4, rx: 2, fill: TRACK}, tl);
const tlFill = el("rect", {x: 0, y: TL.h + 7, width: 0, height: 4, rx: 2, fill: INK}, tl);
const tlHead = el("rect", {x: -1.5, y: -4, width: 3, height: TL.h + 17, rx: 1.5, fill: INK}, tl);
el("rect", {x: 0, y: -6, width: TL.w, height: TL.h + 24, fill: "transparent"}, tl);

// play / pause button
const btn = el("g", {transform: `translate(${BTN.x},${BTN.y})`, style: "cursor:pointer", role: "button", tabindex: 0, "aria-label": "Play"});
el("circle", {r: BTN.r, fill: INK}, btn);
const btnIcon = el("path", {fill: SURFACE}, btn);
const ICON = {play: "M-6.5,-10 L11,0 L-6.5,10 Z", pause: "M-8.5,-9.5h6v19h-6z M2.5,-9.5h6v19h-6z"};
function updateBtn() {
  btnIcon.setAttribute("d", playing ? ICON.pause : ICON.play);
  btn.setAttribute("aria-label", playing ? "Pause" : "Play");
}

// right panel
const P = PANEL, pw = P.r - P.x;
const dateText = el("text", {x: P.x, y: 44, class: "t-date"});
const dayText = el("text", {x: P.r, y: 44, class: "t-sub", "text-anchor": "end"});
const profitCap = el("text", {x: P.x, y: 84, class: "t-cap"});
function profitRow(y, label, stroke, width) {
  el("line", {x1: P.x, x2: P.x + 22, y1: y - 6, y2: y - 6, stroke, "stroke-width": width, "stroke-linecap": "round"});
  el("text", {x: P.x + 32, y, class: "t-row"}, null, label);
  return el("text", {x: P.r, y: y + 2, class: "t-val"});
}
const valPlan = profitRow(116, "Our plan", INK, 3), valNothing = profitRow(148, REF, NOTHING, 2.5);
el("rect", {x: P.x, y: 164, width: pw, height: 42, rx: 8, fill: cssVar("--region")});
el("text", {x: P.x + 14, y: 190, class: "t-row"}, null, "Difference");
const valDelta = el("text", {x: P.r - 12, y: 194, class: "t-delta"});

// cumulative profit charts: one tall chart for the average; with a scenario picked, the scenario above and the average below
const yMax = Math.ceil(Math.max(tp.profit, DATA.totals.ref.profit,
  ...DATA.scenarios.flatMap(s => KEYS.map(k => total(s[k].profit)))) / 1e6) * 1e6;
function makeChart(y, hgt) {
  const g = el("g", {}), x0 = P.x + 34, w = pw - 46, step = hgt < 120 ? 2e6 : 1e6;
  const cx = t => x0 + t / DAYS * w, cy = v => y + hgt - v / yMax * hgt;
  for (let d = 0; d < DAYS; d++) if (isWeekend(d)) el("rect", {x: cx(d), y, width: w / DAYS, height: hgt, fill: cssVar("--region")}, g);
  for (let v = 0; v <= yMax; v += step) {
    el("line", {x1: x0, x2: x0 + w, y1: cy(v), y2: cy(v), stroke: v ? RULE : "#b9b8b0", "stroke-width": 1}, g);
    el("text", {x: x0 - 7, y: cy(v) + 3.5, class: "t-axis", "text-anchor": "end"}, g, v ? (v / 1e6) + " M" : "0");
  }
  for (const d of [0, 6, 13]) el("text", {x: cx(d + 0.5), y: y + hgt + 15, class: "t-axis", "text-anchor": "middle"}, g, `${dates[d].getDate()} ${MON[dates[d].getMonth()]}`);
  const mkLine = (stroke, sw) => el("path", {fill: "none", stroke, "stroke-width": sw, "stroke-linejoin": "round", "stroke-linecap": "round"}, g);
  const lines = {ref: mkLine(NOTHING, 2.2), plan: mkLine(INK, 2.6)};
  const dots = {ref: el("circle", {r: 4.5, fill: NOTHING, stroke: SURFACE, "stroke-width": 2}, g),
                plan: el("circle", {r: 4.5, fill: INK, stroke: SURFACE, "stroke-width": 2}, g)};
  function update(profit) {             // profit = {ref: per day, plan: per day}
    const full = Math.min(Math.floor(tau), DAYS);
    for (const k of KEYS) {
      let d = `M${cx(0)},${cy(0)}`;
      for (let i = 1; i <= full; i++) d += ` L${cx(i).toFixed(1)},${cy(cumul(profit[k], i)).toFixed(1)}`;
      if (tau > full) d += ` L${cx(tau).toFixed(1)},${cy(cumul(profit[k], tau)).toFixed(1)}`;
      lines[k].setAttribute("d", d);
      dots[k].setAttribute("cx", cx(tau)); dots[k].setAttribute("cy", cy(cumul(profit[k], tau)));
    }
  }
  return {g, update};
}
const chartBig = makeChart(232, 196), chartScen = makeChart(230, 80), chartAvg = makeChart(362, 74);
const avgCap = el("g", {});
el("text", {x: P.x, y: 352, class: "t-cap"}, avgCap, `AVERAGE OF ${DATA.n_scenarios} SCENARIOS`);
const avgVals = el("text", {x: P.r, y: 352, class: "t-small", "text-anchor": "end"}, avgCap);
const AVG = {ref: DATA.plans.ref.profit, plan: DATA.plans.plan.profit};

// demand served
el("text", {x: P.x, y: 480, class: "t-cap"}, null, "NEW DEMAND SERVED SO FAR");
function servedRow(y, label, fill) {
  el("text", {x: P.x, y: y + 4, class: "t-small"}, null, label);
  el("rect", {x: P.x + 78, y: y - 4, width: pw - 130, height: 8, rx: 4, fill: TRACK});
  return {bar: el("rect", {x: P.x + 78, y: y - 4, width: 0, height: 8, rx: 4, fill}),
          val: el("text", {x: P.r, y: y + 4.5, class: "t-row", "text-anchor": "end", "font-weight": 600})};
}
const srvPlan = servedRow(501, "Our plan", INK), srvNothing = servedRow(522, REF, NOTHING);

// moves so far
el("text", {x: P.x, y: 554, class: "t-cap"}, null, "OUR PLAN SO FAR");
const movesText = el("text", {x: P.x, y: 575, class: "t-row"});

// legend
const LG = {y: 604};
const grad = el("linearGradient", {id: "div"}, el("defs", {}));
for (let i = 0; i <= 10; i++) el("stop", {offset: i * 10 + "%", "stop-color": color(i / 5 - 1)}, grad);
el("rect", {x: P.x, y: LG.y, width: 136, height: 10, rx: 5, fill: "url(#div)", stroke: "#b9b8b0", "stroke-width": 0.8});
el("text", {x: P.x, y: LG.y + 25, class: "t-small"}, null, "demand lost");
el("text", {x: P.x + 136, y: LG.y + 25, class: "t-small", "text-anchor": "end"}, null, "cars idle");
el("rect", {x: P.x + 160, y: LG.y + 2, width: 11, height: 6, rx: 1.6, fill: "#2b2b29"});
el("text", {x: P.x + 178, y: LG.y + 9, class: "t-small"}, null, "truck (≤ 8 cars)");
el("circle", {cx: P.x + 165.5, cy: LG.y + 21, r: 2.8, fill: SURFACE, stroke: "#2b2b29", "stroke-width": 1.6});
el("text", {x: P.x + 178, y: LG.y + 25, class: "t-small"}, null, "driven car");
el("text", {x: P.x + 286, y: LG.y + 9, class: "t-small", "font-weight": 700, fill: INK}, null, "+5  −12");
el("text", {x: P.x + 286, y: LG.y + 25, class: "t-small"}, null, "added, removed");
el("text", {x: P.x, y: 700, class: "t-hint"}, null, "Space: play / pause  ·  ← →: one day  ·  R: restart  ·  F: fullscreen");

// ---------- frame ----------
let tau = 0, playing = false, last = null;
function drawStrip(strip) {
  const p = VIEW[strip.key], count = {trucks: 0, trucked: 0, driven: 0, removed: 0, added: 0};
  strip.st.forEach((n, i) => {
    const cars = atDay(p.fleet[i], tau, INIT.fleet[i]), v = atDay(p.balance[i], tau, VIEW.init.balance[i]), r = radius(cars);
    n.c.setAttribute("r", r.toFixed(2));
    n.c.setAttribute("fill", color(v));
    n.count.textContent = r >= 11 ? Math.round(cars) : "";
    n.count.setAttribute("fill", Math.abs(v) > 0.55 ? "#ffffff" : INK);
    n.label.setAttribute("y", (n.y + r + 14).toFixed(1));
  });
  for (const m of strip.movers) {
    if (tau > m.t0) { if (m.mode === "truck") { count.trucks++; count.trucked += m.cars; } else count.driven++; }
    const q0 = (tau - m.t0) / (m.t1 - m.t0);
    if (q0 <= 0 || q0 >= 1) { m.el.setAttribute("visibility", "hidden"); continue; }
    const q = smooth(q0), a = 1 - q;
    const x = a * a * m.x0 + 2 * a * q * m.cx + q * q * m.x1, y = a * a * m.y0 + 2 * a * q * m.cy + q * q * m.y1;
    const tx = 2 * a * (m.cx - m.x0) + 2 * q * (m.x1 - m.cx), ty = 2 * a * (m.cy - m.y0) + 2 * q * (m.y1 - m.cy);
    m.el.setAttribute("visibility", "visible");
    m.el.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.atan2(ty, tx) * 180 / Math.PI).toFixed(1)})`);
  }
  for (const r of strip.pops) {
    if (tau > r.t0) count[r.sign > 0 ? "added" : "removed"] += r.cars;
    const q = (tau - r.t0) / 0.85;
    if (q <= 0 || q >= 1) { r.el.setAttribute("visibility", "hidden"); continue; }
    const i = sIdx[r.station], n = strip.st[i], rad = radius(atDay(p.fleet[i], tau, INIT.fleet[i]));
    r.el.setAttribute("visibility", "visible");
    r.el.setAttribute("x", (n.x + rad * 0.72 + 3).toFixed(1));
    r.el.setAttribute("y", (n.y - rad * 0.72 - 2 - 16 * q).toFixed(1));
    r.el.setAttribute("opacity", (q < 0.6 ? 1 : (1 - q) / 0.4).toFixed(2));
  }
  return count;
}
function setScenario(sel) {            // -1 = average over all scenarios
  VIEW = makeView(sel);
  const one = sel >= 0, name = one ? DATA.scenarios[sel].label : "";
  picker.value = sel;
  subText.textContent = (one ? `${name} of the ${DATA.n_scenarios} demand scenarios of our scorer.`
                             : `Expected values over ${DATA.n_scenarios} demand scenarios (our scorer).`) + " Circle area = cars at the station.";
  profitCap.textContent = one ? `PROFIT SO FAR IN ${name.toUpperCase()}` : "EXPECTED PROFIT SO FAR";
  chartBig.g.setAttribute("visibility", one ? "hidden" : "visible");
  for (const g of [chartScen.g, chartAvg.g, avgCap]) g.setAttribute("visibility", one ? "visible" : "hidden");
  draw();
}
function draw() {
  drawStrip(stripA);
  const c = drawStrip(stripB);

  const di = clamp(Math.floor(tau), 0, DAYS - 1), dt = dates[di];
  dateText.textContent = `${WD[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}`;
  dayText.textContent = `day ${di + 1} of ${DAYS}`;
  const pp = cumul(VIEW.plan.profit, tau), pn = cumul(VIEW.ref.profit, tau);
  valPlan.textContent = fmtM(pp); valNothing.textContent = fmtM(pn);
  const diff = pp - pn, done = tau >= DAYS;
  valDelta.textContent = (diff >= 0 ? "+" : "−") + fmtM(Math.abs(diff)) + (done ? `  (+${Math.round(diff / pn * 100)} %)` : "");
  if (VIEW.sel < 0) chartBig.update(AVG);
  else {
    chartScen.update({ref: VIEW.ref.profit, plan: VIEW.plan.profit}); chartAvg.update(AVG);
    avgVals.textContent = `${fmtM(cumul(AVG.plan, tau))}  vs.  ${fmtM(cumul(AVG.ref, tau))}`;
  }
  for (const [row, key] of [[srvPlan, "plan"], [srvNothing, "ref"]]) {
    const dem = cumul(VIEW[key].demandDay, tau), share = dem > 0 ? cumul(VIEW[key].servedDay, tau) / dem : 0;
    row.bar.setAttribute("width", ((pw - 130) * share).toFixed(1));
    row.val.textContent = dem > 0 ? Math.round(share * 100) + " %" : "–";
  }
  movesText.textContent = `${c.trucks} trucks with ${c.trucked} cars · ${c.driven} driven · ${c.removed} removed` + (c.added ? ` · ${c.added} added` : "");
  tlFill.setAttribute("width", (tau / DAYS * TL.w).toFixed(1));
  tlHead.setAttribute("x", (tau / DAYS * TL.w - 1.5).toFixed(1));
  updateBtn();
}
function frame(now) {
  if (playing) {
    if (last !== null) tau = Math.min(DAYS, tau + (now - last) / 1000 / SEC_PER_DAY);
    last = now;
    if (tau >= DAYS) playing = false;
    draw();
    requestAnimationFrame(frame);
  }
}
function play(on) {
  if (on && tau >= DAYS) tau = 0;
  playing = on; last = null;
  updateBtn();
  if (on) requestAnimationFrame(frame);
}
function seek(t) { tau = clamp(t, 0, DAYS); last = null; draw(); }

// ---------- interaction ----------
btn.addEventListener("click", () => { play(!playing); btn.blur(); });
picker.addEventListener("change", () => { setScenario(+picker.value); picker.blur(); });
window.addEventListener("keydown", ev => {
  if (ev.target === picker) return;      // the dropdown handles its own keys
  if (ev.key === " " || (ev.key === "Enter" && ev.target === btn)) { ev.preventDefault(); play(!playing); }
  else if (ev.key === "ArrowRight") { play(false); seek(Math.floor(tau + 1e-6) + 1); }
  else if (ev.key === "ArrowLeft") { play(false); seek(Math.ceil(tau - 1e-6) - 1); }
  else if (ev.key === "r" || ev.key === "R") { play(false); seek(0); }
  else if (ev.key === "f" || ev.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
function tlSeek(ev) {
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(tl.getScreenCTM().inverse());
  seek(pt.x / TL.w * DAYS);
}
let dragging = false;
tl.addEventListener("pointerdown", ev => { dragging = true; tl.setPointerCapture(ev.pointerId); play(false); tlSeek(ev); });
tl.addEventListener("pointermove", ev => { if (dragging) tlSeek(ev); });
tl.addEventListener("pointerup", () => { dragging = false; });

const tip = document.getElementById("tip");
function showTip(ev, key, i) {
  const p = VIEW[key], d = clamp(Math.floor(tau), 0, DAYS - 1), s = DATA.stations[i];
  const f = v => Math.round(v).toLocaleString("en");
  tip.innerHTML = `<b>${s.station_name}</b> <span>(${s.station_type}, ${key === "plan" ? "our plan" : REF.toLowerCase()}, day ${d + 1})</span><br>` +
    `${f(p.fleet[i][d])} cars at the station<br>${f(p.free[i][d])} available for new rentals<br>` +
    `${f(p.demand[i][d])} ${VIEW.sel < 0 ? "expected new demand" : "new demand"}<br>${f(p.served[i][d])} served, ${f(p.demand[i][d] - p.served[i][d])} lost`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, ev.clientY - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }

setScenario(-1);
if (new URLSearchParams(location.search).has("autoplay")) play(true);
</script>
