function buildMovers(transfers) {

  return {bar: el("rect", {x: P.x + 78, y: y - 4, width: 0, height: 8, rx: 4, fill}),
          val: el("text", {x: P.r, y: y + 4.5, class: "t-row", "text-anchor": "end", "font-weight": 600})};
}
const srvPlan = servedRow(498, "Our plan", INK), srvNothing = servedRow(520, REF, NOTHING);

// moves so far
el("text", {x: P.x, y: 560, class: "t-cap"}, null, "OUR PLAN SO FAR");
const movesText = el("text", {x: P.x, y: 582, class: "t-row"});

// legend
const LG = {y: 618};
const grad = el("linearGradient", {id: "div"}, el("defs", {}));
for (let i = 0; i <= 10; i++) el("stop", {offset: i * 10 + "%", "stop-color": color(i / 5 - 1)}, grad);
el("rect", {x: P.x, y: LG.y, width: 136, height: 10, rx: 5, fill: "url(#div)", stroke: "#b9b8b0", "stroke-width": 0.8});
el("text", {x: P.x, y: LG.y + 25, class: "t-small"}, null, "demand lost");
el("text", {x: P.x + 136, y: LG.y + 25, class: "t-small", "text-anchor": "end"}, null, "cars idle");
el("rect", {x: P.x + 160, y: LG.y + 2, width: 11, height: 6, rx: 1.6, fill: "#2b2b29"});
el("text", {x: P.x + 178, y: LG.y + 9, class: "t-small"}, null, "truck (≤ 8 cars)");
el("circle", {cx: P.x + 165.5, cy: LG.y + 21, r: 2.8, fill: SURFACE, stroke: "#2b2b29", "stroke-width": 1.6});
el("text", {x: P.x + 178, y: LG.y + 25, class: "t-small"}, null, "driven car");
el("text", {x: P.x + 286, y: LG.y + 9, class: "t-small", "font-weight": 700, fill: INK}, null, "+5  −12");
el("text", {x: P.x + 286, y: LG.y + 25, class: "t-small"}, null, "added, removed");
el("text", {x: P.x, y: 700, class: "t-hint"}, null, "Space: play / pause  ·  ← →: one day  ·  R: restart  ·  F: fullscreen");

// ---------- frame ----------
let tau = 0, playing = false, last = null;
function drawStrip(strip) {
  const p = DATA.plans[strip.key], count = {trucks: 0, trucked: 0, driven: 0, removed: 0, added: 0};
  strip.st.forEach((n, i) => {
    const cars = atDay(p.fleet[i], tau, INIT.fleet[i]), v = atDay(p.balance[i], tau, INIT.balance[i]), r = radius(cars);
    n.c.setAttribute("r", r.toFixed(2));
    n.c.setAttribute("fill", color(v));
    n.count.textContent = r >= 11 ? Math.round(cars) : "";
    n.count.setAttribute("fill", Math.abs(v) > 0.55 ? "#ffffff" : INK);
    n.label.setAttribute("y", (n.y + r + 14).toFixed(1));
  });
  for (const m of strip.movers) {
    if (tau > m.t0) { if (m.mode === "truck") { count.trucks++; count.trucked += m.cars; } else count.driven++; }
    const q0 = (tau - m.t0) / (m.t1 - m.t0);
    if (q0 <= 0 || q0 >= 1) { m.el.setAttribute("visibility", "hidden"); continue; }
    const q = smooth(q0), a = 1 - q;
    const x = a * a * m.x0 + 2 * a * q * m.cx + q * q * m.x1, y = a * a * m.y0 + 2 * a * q * m.cy + q * q * m.y1;
    const tx = 2 * a * (m.cx - m.x0) + 2 * q * (m.x1 - m.cx), ty = 2 * a * (m.cy - m.y0) + 2 * q * (m.y1 - m.cy);
    m.el.setAttribute("visibility", "visible");
    m.el.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.atan2(ty, tx) * 180 / Math.PI).toFixed(1)})`);
  }
  for (const r of strip.pops) {
    if (tau > r.t0) count[r.sign > 0 ? "added" : "removed"] += r.cars;
    const q = (tau - r.t0) / 0.85;
    if (q <= 0 || q >= 1) { r.el.setAttribute("visibility", "hidden"); continue; }
    const i = sIdx[r.station], n = strip.st[i], rad = radius(atDay(p.fleet[i], tau, INIT.fleet[i]));
    r.el.setAttribute("visibility", "visible");
    r.el.setAttribute("x", (n.x + rad * 0.72 + 3).toFixed(1));
    r.el.setAttribute("y", (n.y - rad * 0.72 - 2 - 16 * q).toFixed(1));
    r.el.setAttribute("opacity", (q < 0.6 ? 1 : (1 - q) / 0.4).toFixed(2));
  }
  return count;
}
function linePath(arr) {
  let d = `M${cx_(0)},${cy_(0)}`;
  const full = Math.min(Math.floor(tau), DAYS);
  for (let i = 1; i <= full; i++) d += ` L${cx_(i).toFixed(1)},${cy_(cumul(arr, i)).toFixed(1)}`;
  if (tau > full) d += ` L${cx_(tau).toFixed(1)},${cy_(cumul(arr, tau)).toFixed(1)}`;
  return d;
}
function draw() {
  drawStrip(stripA);
  const c = drawStrip(stripB);

  const di = clamp(Math.floor(tau), 0, DAYS - 1), dt = dates[di];
  dateText.textContent = `${WD[dt.getDay()]} ${dt.getDate()} ${MON[dt.getMonth()]}`;
  dayText.textContent = `day ${di + 1} of ${DAYS}`;
  const pp = cumul(DATA.plans.plan.profit, tau), pn = cumul(DATA.plans.ref.profit, tau);
  valPlan.textContent = fmtM(pp); valNothing.textContent = fmtM(pn);
  const diff = pp - pn, done = tau >= DAYS;
  valDelta.textContent = (diff >= 0 ? "+" : "−") + fmtM(Math.abs(diff)) + (done ? `  (+${Math.round(diff / pn * 100)} %)` : "");
  linePlan.setAttribute("d", linePath(DATA.plans.plan.profit)); lineNothing.setAttribute("d", linePath(DATA.plans.ref.profit));
  dotPlan.setAttribute("cx", cx_(tau)); dotPlan.setAttribute("cy", cy_(pp));
  dotNothing.setAttribute("cx", cx_(tau)); dotNothing.setAttribute("cy", cy_(pn));
  for (const [row, key] of [[srvPlan, "plan"], [srvNothing, "ref"]]) {
    const dem = cumul(DATA.plans[key].demandDay, tau), share = dem > 0 ? cumul(DATA.plans[key].servedDay, tau) / dem : 0;
    row.bar.setAttribute("width", ((pw - 130) * share).toFixed(1));
    row.val.textContent = dem > 0 ? Math.round(share * 100) + " %" : "–";
  }
  movesText.textContent = `${c.trucks} trucks with ${c.trucked} cars · ${c.driven} driven · ${c.removed} removed` + (c.added ? ` · ${c.added} added` : "");
  tlFill.setAttribute("width", (tau / DAYS * TL.w).toFixed(1));
  tlHead.setAttribute("x", (tau / DAYS * TL.w - 1.5).toFixed(1));
  updateBtn();
}
function frame(now) {
  if (playing) {
    if (last !== null) tau = Math.min(DAYS, tau + (now - last) / 1000 / SEC_PER_DAY);
    last = now;
    if (tau >= DAYS) playing = false;
    draw();
    requestAnimationFrame(frame);
  }
}
function play(on) {
  if (on && tau >= DAYS) tau = 0;
  playing = on; last = null;
  updateBtn();
  if (on) requestAnimationFrame(frame);
}
function seek(t) { tau = clamp(t, 0, DAYS); last = null; draw(); }

// ---------- interaction ----------
btn.addEventListener("click", () => { play(!playing); btn.blur(); });
window.addEventListener("keydown", ev => {
  if (ev.key === " " || (ev.key === "Enter" && ev.target === btn)) { ev.preventDefault(); play(!playing); }
  else if (ev.key === "ArrowRight") { play(false); seek(Math.floor(tau + 1e-6) + 1); }
  else if (ev.key === "ArrowLeft") { play(false); seek(Math.ceil(tau - 1e-6) - 1); }
  else if (ev.key === "r" || ev.key === "R") { play(false); seek(0); }
  else if (ev.key === "f" || ev.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
function tlSeek(ev) {
  const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(tl.getScreenCTM().inverse());
  seek(pt.x / TL.w * DAYS);
}
let dragging = false;
tl.addEventListener("pointerdown", ev => { dragging = true; tl.setPointerCapture(ev.pointerId); play(false); tlSeek(ev); });
tl.addEventListener("pointermove", ev => { if (dragging) tlSeek(ev); });
tl.addEventListener("pointerup", () => { dragging = false; });

const tip = document.getElementById("tip");
function showTip(ev, key, i) {
  const p = DATA.plans[key], d = clamp(Math.floor(tau), 0, DAYS - 1), s = DATA.stations[i];
  const f = v => Math.round(v).toLocaleString("en");
  tip.innerHTML = `<b>${s.station_name}</b> <span>(${s.station_type}, ${key === "plan" ? "our plan" : REF.toLowerCase()}, day ${d + 1})</span><br>` +
    `${f(p.fleet[i][d])} cars at the station<br>${f(p.free[i][d])} available for new rentals<br>` +
    `${f(p.demand[i][d])} expected new demand<br>${f(p.served[i][d])} served, ${f(p.demand[i][d] - p.served[i][d])} lost`;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - w - 8) + "px";
  tip.style.top = Math.max(8, ev.clientY - h - 12) + "px";
}
function hideTip() { tip.style.display = "none"; }

draw();
if (new URLSearchParams(location.search).has("autoplay")) play(true);
</script>
